name: Update IPTV Playlist

on:
  schedule:
    # Посилання YouTube живуть ~6 год, а cron GitHub може запізнюватись,
    # тому оновлюємо кожні 3 години (на 17-й хвилині — менше черги).
    - cron: '17 */3 * * *'
  workflow_dispatch:        # ручний запуск кнопкою на сайті
  push:
    paths:
      - 'channels.txt'
      - 'update_playlist.py'
      - 'yt_resolver.py'
      - '.github/workflows/update.yml'

permissions:
  contents: write

concurrency:
  group: update-playlist
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Set up Deno (JS runtime, потрібен yt-dlp для YouTube)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies (завжди найновіший yt-dlp)
        run: pip install -U -r requirements-actions.txt

      - name: VPN Cloudflare WARP (обхід блокування IP GitHub)
        continue-on-error: true
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq && sudo apt-get install -y -qq cloudflare-warp
          warp-cli --accept-tos registration new
          # Режим proxy: через WARP іде лише те, що явно використовує проксі (тільки yt-dlp)
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos proxy port 40000
          warp-cli --accept-tos connect
          for i in $(seq 1 15); do warp-cli --accept-tos status | grep -q Connected && break; sleep 2; done
          warp-cli --accept-tos status
          if curl -fsS --max-time 15 -x socks5h://127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace | grep -q 'warp=on'; then
            echo "YTDLP_PROXY=socks5h://127.0.0.1:40000" >> "$GITHUB_ENV"
            echo "WARP працює, yt-dlp піде через нього"
          else
            echo "::warning::WARP не підключився — працюю без VPN"
          fi

      - name: Cookies from secret (необов'язково)
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then
            printf '%s\n' "$YT_COOKIES" > cookies.txt
            echo "cookies.txt створено із секрету"
          else
            echo "Секрет YT_COOKIES не задано — працюю без cookies"
          fi

      - name: Generate playlist
        run: python update_playlist.py

      - name: Commit and push
        if: always()
        run: |
          rm -f cookies.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streams.m3u8
          if git diff --cached --quiet; then
            echo "Змін немає"
            exit 0
          fi
          git commit -m "Auto-update streams.m3u8 [$(date -u +'%Y-%m-%d %H:%M UTC')]"
          git pull --rebase --autostash
          git push
